name: release

# Main-driven release (docs/adr/0018 + docs/adr/0019). Pushing a version bump
# to main runs the full gate, tags the release commit, then — depending on
# whether the version carries a prerelease identifier — either opens a GitHub
# prerelease with the tarball attached (npm is skipped) or publishes to npm and
# opens a stable Release with the same tarball. The body always comes from
# docs/releases/v<version>.md, never --generate-notes, which would flatten the
# fixed bilingual template into a list of PR titles.
#
# Every step checks state first, so a partially completed release can be
# re-run: an already-published npm version is skipped, an existing tag or
# Release is not recreated (the Release body is edited in place). npm publish
# sits after the tag and before the stable Release — it is the only irreversible
# step, and the version bar's "update available" prompt reads releases/latest,
# which GitHub already excludes prereleases from server-side.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write   # push the release tag, create / edit the Release
  id-token: write   # npm provenance / Trusted Publishing

# One release at a time; never cancel one halfway (npm publish is not
# transactional with the tag or Release that follows it).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      # Read what has already happened for this version, before spending a
      # minute on a gate that may not be needed. A version carrying a hyphen
      # (1.8.0-rc.1) is a prerelease: GitHub only, npm never.
      - id: state
        name: Release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1 && echo "tag=done" >> "$GITHUB_OUTPUT" || true
          gh release view "v$V" >/dev/null 2>&1 && echo "gh=done" >> "$GITHUB_OUTPUT" || true
          # npm only participates in formal releases; prereleases never
          # publish, so a stray npm hit would only confuse the skip logic.
          if [ "${V#*-}" = "$V" ]; then
            npm view "@xbzbing/dsh-git-panel@$V" version >/dev/null 2>&1 && echo "npm=done" >> "$GITHUB_OUTPUT" || true
          else
            echo "npm=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate
        if: steps.state.outputs.npm != 'done' || steps.state.outputs.tag != 'done' || steps.state.outputs.gh != 'done'
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          # The body ships with the release commit; a missing file must fail
          # before the irreversible npm step, not after it.
          if [ ! -f "docs/releases/v$V.md" ]; then
            echo "::error::docs/releases/v$V.md is missing — write it from .github/RELEASE_TEMPLATE.md and commit it with the version bump"
            exit 1
          fi
          npm ci
          npx --no-install playwright-core install --with-deps chromium
          npm run check
          npm pack
          mkdir -p pkg && tar -xzf "xbzbing-dsh-git-panel-$V.tgz" -C pkg
          node scripts/assert-pack.mjs pkg/package

      - name: Tag
        if: steps.state.outputs.tag != 'done'
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          git push origin "refs/tags/v$V"

      # Trusted Publishing (OIDC) is preferred; drop the secret and register
      # this workflow as a trusted publisher on npmjs.com. With the secret
      # present, npm authenticates with it instead. Prereleases never reach
      # this step (docs/adr/0018).
      - name: Publish to npm
        if: steps.state.outputs.prerelease != 'true' && steps.state.outputs.npm != 'done'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          npm publish "xbzbing-dsh-git-panel-$V.tgz" --provenance --access public

      - name: GitHub Release
        if: steps.state.outputs.gh != 'done'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          if [ "${{ steps.state.outputs.prerelease }}" = "true" ]; then
            CHANNEL=(--prerelease)
          else
            CHANNEL=(--latest)
          fi
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release edit "v$V" --title "v$V" --notes-file "docs/releases/v$V.md" "${CHANNEL[@]}"
          else
            gh release create "v$V" "xbzbing-dsh-git-panel-$V.tgz" \
              --title "v$V" --notes-file "docs/releases/v$V.md" --verify-tag "${CHANNEL[@]}"
          fi
